name: WordrootWatch
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    watchOS: "10.0"
settings:
  DEVELOPMENT_TEAM: QMM486NPYC
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  CODE_SIGN_STYLE: Automatic
targets:
  WordrootWatch:
    type: application
    platform: watchOS
    sources:
      - path: .
        excludes:
          - "*.xcodeproj"
          - "*.yml"
          - "*.md"
          - "*.sh"
          - "Harness"
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_WKWatchOnly: YES
      INFOPLIST_KEY_CFBundleDisplayName: Wordroot
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.etyma.watchos
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_NAME: Wordroot
