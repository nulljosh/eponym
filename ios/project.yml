name: Wordroot
options:
  bundleIdPrefix: com.heyitsmejosh
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
# The twelve interface languages Wordroot ships. Strings resolve through the generated
# Catalog rather than .lproj bundles, so the in-app picker works regardless of the system
# language; this list documents the set and keeps Xcode's own language menus in step.
knownRegions: [en, es, fr, de, pt, it, nl, ru, ja, zh-Hans, ko, ar]
settings:
  MARKETING_VERSION: "1.7.0"
  "MARKETING_VERSION[sdk=macosx*]": "1.7.0"
  CURRENT_PROJECT_VERSION: 202610161204
  "CURRENT_PROJECT_VERSION[sdk=macosx*]": 202610161220
  SWIFT_VERSION: "5.9"
targets:
  Wordroot:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Sources
      - path: ../fonts
        excludes: ["*.woff2"]
    scheme:
      testTargets:
        - WordrootTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.etyma
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
      DEVELOPMENT_TEAM: QMM486NPYC
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Wordroot.entitlements
    dependencies:
      - target: WordrootWatch
        platformFilter: iOS
        embed: true
  # The watch app is plain SwiftUI with its own sources; it rides inside the iPhone app on the App Store.
  WordrootWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../watchos
        excludes: ["*.xcodeproj", "*.yml", "*.md", "*.sh", "Harness"]
      - path: Sources/RootSans.swift
      - path: ../fonts
        excludes: ["*.woff2"]
    settings:
      SWIFT_VERSION: "6.0"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.heyitsmejosh.etyma
      INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
      INFOPLIST_KEY_CFBundleDisplayName: Wordroot
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.etyma.watchos
      PRODUCT_NAME: Wordroot
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: QMM486NPYC
      CODE_SIGN_STYLE: Automatic
  WordrootTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: Wordroot
    settings:
      GENERATE_INFOPLIST_FILE: YES
      # xcodegen emits an iOS-shaped TEST_HOST; on macOS the binary lives in Contents/MacOS.
      # BUNDLE_EXECUTABLE_FOLDER_PATH is empty on iOS, so one value covers both destinations.
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/Wordroot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Wordroot
