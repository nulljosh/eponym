name: Eponym
options:
  bundleIdPrefix: com.heyitsmejosh
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
# The twelve interface languages Eponym ships. Strings resolve through the generated
# Catalog rather than .lproj bundles, so the in-app picker works regardless of the system
# language; this list documents the set and keeps Xcode's own language menus in step.
knownRegions: [en, es, fr, de, pt, it, nl, ru, ja, zh-Hans, ko, ar]
settings:
  # One version and one build number for iPhone, Mac, watch and widget. Bump both here every release.
  MARKETING_VERSION: "2.0.0"
  CURRENT_PROJECT_VERSION: 202610281345
  SWIFT_VERSION: "5.9"
targets:
  Eponym:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Sources
      - path: ../fonts
        excludes: ["*.woff2"]
    scheme:
      testTargets:
        - EponymTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.etyma
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
      DEVELOPMENT_TEAM: QMM486NPYC
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Eponym.entitlements
    # The widget's deep link: eponym://word/<word> opens that word; wordroot:// is kept for links made before the rename.
    info:
      path: Info.plist
      properties:
        # xcodegen writes 1.0 and 1 here unless told; these keep the versions coming from the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.heyitsmejosh.etyma
            CFBundleURLSchemes: [eponym, wordroot]
        # Mac: Services > Look Up in Eponym on any selected text (LookUpService). iOS ignores it.
        NSServices:
          - NSMenuItem:
              default: Look Up in Eponym
            NSMessage: lookUp
            NSPortName: Eponym
            NSSendTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
    dependencies:
      - target: EponymWatch
        platformFilter: iOS
        embed: true
      - target: EponymWidget
        embed: true
  # Word of the day on the Home Screen and the Mac desktop. Shares the generated catalog and Root Sans with the app.
  EponymWidget:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - Widget
      - path: Sources/Localized.swift
      - path: Sources/RootSans.swift
      - path: ../fonts
        excludes: ["*.woff2"]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.etyma.widget
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Eponym
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
      DEVELOPMENT_TEAM: QMM486NPYC
      CODE_SIGN_STYLE: Automatic
      SKIP_INSTALL: YES
  # The watch app is plain SwiftUI with its own sources; it rides inside the iPhone app on the App Store.
  EponymWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../watchos
        excludes: ["*.xcodeproj", "*.yml", "*.md", "*.sh", "Harness"]
      - path: Sources/RootSans.swift
      - path: ../fonts
        excludes: ["*.woff2"]
    settings:
      SWIFT_VERSION: "6.0"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.heyitsmejosh.etyma
      INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
      INFOPLIST_KEY_CFBundleDisplayName: Eponym
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.etyma.watchos
      PRODUCT_NAME: Eponym
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: QMM486NPYC
      CODE_SIGN_STYLE: Automatic
  EponymTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: Eponym
    settings:
      GENERATE_INFOPLIST_FILE: YES
      # xcodegen emits an iOS-shaped TEST_HOST; on macOS the binary lives in Contents/MacOS.
      # BUNDLE_EXECUTABLE_FOLDER_PATH is empty on iOS, so one value covers both destinations.
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/Eponym.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Eponym
