<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordroot — dictionary + etymology</title>
<script src="i18n.js"></script>
<script>window.i18n.applyDocumentLanguage();</script>
<style>
  @font-face { font-family: "Wordroot Sans"; font-weight: 400; font-display: swap; src: url(fonts/WordrootSans-Regular.woff2) format("woff2"); }
  @font-face { font-family: "Wordroot Sans"; font-weight: 700; font-display: swap; src: url(fonts/WordrootSans-Bold.woff2) format("woff2"); }
  :root {
    --bg: #ffffff; --bg2: #f5f5f5; --text: #252a49; --text2: #666;
    --accent: #0a62d8;
  --link: #0a58c2; --border: #e8e8e8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111;
    --link: #5aa9ff; --bg2: #1a1a1a; --text: #e8e8f0; --text2: rgba(232,232,240,.6); --border: rgba(232,232,240,.1); }
  }
  @media (prefers-reduced-motion: reduce) { #bg, #bgPhoto { transition: none; } }
  .tagline { color: var(--text); opacity: .78; font-size: 1.05rem; margin: -.4rem 0 1.25rem; }
  .embed .tagline { display: none; }
  /* The pickers are settings, not content: no box, no fill, secondary color. */
  .topbar select, .search select { border: 0; background: transparent; color: var(--text); opacity: .72; font: inherit; font-size: .9rem; padding: .35rem .2rem; box-shadow: none; }
  .topbar select:hover, .search select:hover { opacity: 1; }
  h1 { letter-spacing: -.02em; }
  * { box-sizing: border-box; }
  /* ponytail: one flat per-word tint, no gradients; hue is set per-word via JS */
  #bg { position: fixed; inset: 0; z-index: -1; --hue: 210; background: hsl(var(--hue) 35% 90%); transition: background 1s ease; }
  @media (prefers-color-scheme: dark) { #bg { background: hsl(var(--hue) 25% 14%); } }
  /* A real photo of the word replaces the tint once one loads; #bg stays as the
     always-present fallback for words with no Wikipedia photo. */
  #bgPhoto {
    position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center;
    opacity: 0; transition: opacity .6s ease;
  }
  #bgPhoto.on { opacity: 1; }
  #bgPhoto::after { content: ''; position: absolute; inset: 0; background: var(--bg); opacity: .55; }
  body { font-family: "Wordroot Sans", -apple-system, system-ui, "Segoe UI", sans-serif; background: transparent; color: var(--text); max-width: 640px; margin: 0 auto; padding: 6vh 1rem 4rem; }
  h1 { font-size: 1.4rem; letter-spacing: -.02em; margin: 0; }
  input { width: 100%; font-size: 1.25rem; padding: .75rem 1rem; border: 1px solid var(--border); border-radius: 10px; background: var(--bg2); color: var(--text); outline: none; }
  input:focus { border-color: var(--link, var(--accent)); }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; margin-top: 1.5rem; }
  .card h2 { margin: 0 0 .25rem; font-size: 1.2rem; }
  .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text2); margin-bottom: .5rem; }
  .pos { color: var(--link, var(--accent)); font-size: .85rem; font-weight: 600; margin-top: .75rem; }
  /* padding-inline, not padding-left: the numbers must sit on the start edge in Arabic too */
  ol.defs { margin: .25rem 0 0; padding-inline-start: 1.25rem; }
  ol.defs li { margin: .3rem 0; line-height: 1.45; }
  .chain { list-style: none; padding: 0; margin: .25rem 0 0; }
  .chain li { padding: .45rem 0; border-bottom: 1px solid var(--border); }
  .chain li:last-child { border-bottom: none; }
  /* Ancestor first, relation and language as a caption beneath. A single run-on line
     ("inherited from X Latin") cannot be translated without reordering, and word order
     differs in every one of the twelve locales; two lines read correctly in all of them. */
  .chain .anc { font-weight: 600; }
  .chain .meta { font-size: .85rem; color: var(--text2); }
  .chain .meta .lang { color: var(--link, var(--accent)); }
  .muted { color: var(--text2); }
  .note { font-size: .78rem; color: var(--text2); margin: .6rem 0 0; }
  .note a { color: var(--link, var(--accent)); }
  .attr { font-size: .75rem; color: var(--text2); margin-top: 2rem; }
  .attr a { color: var(--link, var(--accent)); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
  select {
    font: inherit; font-size: .8rem; padding: .3rem 1.6rem .3rem .5rem; max-width: 11rem;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); color: var(--text);
  }
  /* The word-language picker scopes the search, so it sits with the field rather than beside
     the interface picker — where, in Arabic, the two read as the same word twice over. */
  .search { display: flex; gap: .5rem; align-items: stretch; }
  .search select { font-size: .95rem; flex: 0 0 auto; }
</style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#5B9BD5">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>.embed .topbar{display:none}</style>
  <script>if(/[?&]embed\b/.test(location.search))document.documentElement.classList.add('embed')</script>
</head>
<body>
<div id="bg"></div>
<div id="bgPhoto"></div>
<div class="topbar">
  <h1>Wordroot</h1>
  <span id="uiPicker"></span>
</div>
<p class="tagline" id="tagline"></p>
<div class="search">
  <span id="wordPicker"></span>
  <input type="search" id="q" autofocus autocapitalize="none">
</div>
<div id="wotd"></div>
<div id="out"></div>
<p class="attr" id="attr"></p>
<script>
const t = (k, v) => i18n.t(k, v);
const LINK_RE = /\{\{(inh\+?|der\+?|bor\+?)\|[^|]*\|([^|}]+)\|([^|}]*)/g;
const REL = { inh: 'rel.inherited', der: 'rel.derived', bor: 'rel.borrowed' };
const WORD_LANG_KEY = 'wordroot.wordLang';

const $ = id => document.getElementById(id);
// ponytail: DOMParser is inert (no image loads, no script), decodes entities and drops tags
// in one pass. A regex strip is single-pass, so `<<img>img src=x onerror=y>` survives it —
// and Wiktionary pages are publicly editable.
const strip = s => {
  const body = new DOMParser().parseFromString(s, 'text/html').body;
  body.querySelectorAll('style, script').forEach(el => el.remove());
  return body.textContent;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// Etymology always comes from the English Wiktionary, whatever the interface language is: it
// carries entries for thousands of languages under one consistent set of etymology templates
// ({{inh}}, {{der}}, {{bor}}), whereas fr./de./es. Wiktionary each use their own incompatible
// markup. The word language below selects which ==Language== section of that page to read.
const WIKI = 'https://en.wiktionary.org';

// Definitions are different: they are prose, so the edition decides what language the reader
// gets. Ask the reader's own edition first — fr.wiktionary defines words in French — and fall
// back to English, which is the one edition certain to answer.
const UI_EDITION = i18n.locale.split('-')[0];  // zh-Hans -> zh
const DEF_EDITIONS = UI_EDITION === 'en' ? ['en'] : [UI_EDITION, 'en'];

// Editions that turned out not to serve the definition endpoint at all. Session-only and
// in memory: one wasted probe per session is cheaper than persisting a guess that may be
// wrong tomorrow, and it keeps the privacy policy's list of stored data short.
const noDefinitionEndpoint = new Set();

function storedWordLang() {
  try { return localStorage.getItem(WORD_LANG_KEY); } catch (e) { return null; }
}

/** Default the word language to the interface language when we have a dictionary for it. */
function defaultWordLang() {
  const ui = i18n.locale.split('-')[0];  // zh-Hans -> zh
  return i18n.wordLanguages.some(l => l.code === ui) ? ui : 'en';
}

let wordLang = i18n.wordLanguages.some(l => l.code === storedWordLang())
  ? storedWordLang() : defaultWordLang();

const wordLangMeta = () => i18n.wordLanguages.filter(l => l.code === wordLang)[0];

// ponytail: browsers forbid setting User-Agent on fetch, so the Wikimedia UA policy
// can only be honoured on the native side (see ios/Sources/WordrootApp.swift).
async function definitionsFrom(edition, word, lang) {
  if (noDefinitionEndpoint.has(edition)) return null;
  let r;
  try {
    r = await fetch(`https://${edition}.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(word)}`);
  } catch {
    // A network-level failure here is indistinguishable from the edition not being there;
    // either way, stop asking it and let the English request carry the lookup.
    noDefinitionEndpoint.add(edition);
    return null;
  }
  // 404 means this edition has no page for the word — a normal miss. Anything else non-OK
  // means the endpoint is not served here at all, so stop asking for the rest of the session.
  if (!r.ok) {
    if (r.status !== 404) noDefinitionEndpoint.add(edition);
    return null;
  }
  const d = await r.json();
  // Keyed by the language of each ==section== on the page, so "chat" carries both an `en`
  // and an `fr` entry. Taking only the requested one is what makes the picker mean anything;
  // a page with no section in that language is a miss, not a fallback to another language.
  const entries = d[lang];
  if (!entries || !entries.length) return null;
  const groups = entries.map(e => ({
    pos: e.partOfSpeech,
    defs: e.definitions.map(x => strip(x.definition)).filter(Boolean).slice(0, 4),
  })).filter(g => g.defs.length);
  return groups.length ? { edition, groups } : null;
}

/** Definitions plus the edition they came from, or null. Editions are tried in preference
 *  order but requested together, so the fallback costs no extra round trip. */
async function definitions(word, lang) {
  const wanted = lang || wordLang;
  const tried = await Promise.all(DEF_EDITIONS.map(e => definitionsFrom(e, word, wanted)));
  return tried.filter(Boolean)[0] || null;
}

/** Body of the `==Name==` language section, or null. Stops at the next level-2 heading. */
function languageSection(text, name) {
  const m = new RegExp('^==\\s*' + escRe(name) + '\\s*==\\s*$', 'm').exec(text);
  if (!m) return null;
  const after = text.slice(m.index + m[0].length);
  const end = after.search(/^==[^=]/m);
  return end === -1 ? after : after.slice(0, end);
}

async function etymology(word, lang) {
  const meta = i18n.wordLanguages.filter(l => l.code === (lang || wordLang))[0];
  if (!meta) return [];
  const api = `${WIKI}/w/api.php?action=parse&page=${encodeURIComponent(word)}&prop=wikitext&format=json&origin=*`;
  const r = await fetch(api);
  if (!r.ok) return [];
  const d = await r.json();
  const section = languageSection(d.parse?.wikitext?.['*'] || '', meta.section);
  if (!section) return [];
  const m = section.match(/===?Etymology[^=]*===?\n([\s\S]*?)(\n===?[^=]|$)/);
  if (!m) return [];
  const chain = [];
  for (const x of m[1].matchAll(LINK_RE)) {
    const rel = REL[x[1].replace('+', '')];
    const ancestor = x[3];
    if (rel && ancestor) chain.push({ rel: t(rel), langCode: x[2], lang: i18n.languageName(x[2]), ancestor });
    if (chain.length >= 10) break;
  }
  return chain;
}

function render(el, word, defs, chain) {
  // dir="auto" throughout: the headword and its ancestors can be in any script — an Arabic
  // ancestor inside an English page, or a Latin one inside an Arabic page — and each element
  // has to pick up its own direction independently of the page's.
  let html = `<div class="card"><div class="label">${esc(t('ui.resultsFor', { word }))}</div>` +
    `<h2 dir="auto" lang="${esc(wordLang)}">${esc(word)}</h2>`;
  if (defs && defs.groups.length) {
    for (const g of defs.groups) {
      // Glosses are prose in the edition's own language, not the looked-up word's.
      html += `<div class="pos">${esc(g.pos)}</div><ol class="defs" lang="${esc(defs.edition)}" dir="auto">` +
        g.defs.map(d => `<li>${esc(d)}</li>`).join('') + '</ol>';
    }
    // Say so when the reader asked for one language and got English prose, rather than
    // letting them wonder — and offer the one route to definitions in their own language.
    if (defs.edition !== UI_EDITION) {
      const href = `https://${UI_EDITION}.wiktionary.org/wiki/${encodeURIComponent(word)}`;
      html += `<p class="note">${esc(t('ui.definitionsInEnglish'))} ` +
        `<a href="${esc(href)}" target="_blank" rel="noopener">` +
        `${esc(t('ui.openOnWiktionary', { wiktionary: t('ui.wiktionary') }))}</a></p>`;
    }
  } else {
    html += `<p class="muted">${esc(t('ui.noDefinition'))}</p>`;
  }
  if (chain.length) {
    html += `<div class="card" style="margin:1rem -0.25rem -0.25rem"><div class="label">${esc(t('ui.origin'))}</div><ul class="chain">` +
      chain.map(c =>
        `<li><div class="anc" dir="auto" lang="${esc(c.langCode)}">${esc(c.ancestor)}</div>` +
        `<div class="meta">${esc(c.rel)} · <span class="lang">${esc(c.lang)}</span></div></li>`).join('') +
      '</ul></div>';
  }
  el.innerHTML = html + '</div>';
}

// ponytail: a stable hash of the word picks the hue, so the same word always paints the
// same background and different words visibly differ, without fetching or storing anything.
function hueForWord(word) {
  let h = 0;
  for (const c of word) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return h % 360;
}
// The word's own Wikipedia photo, same source as iOS/Mac — best-effort, no key needed.
async function photoFor(word) {
  try {
    const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(word)}`);
    if (!r.ok) return null;
    const j = await r.json();
    return j.originalimage?.source || j.thumbnail?.source || null;
  } catch { return null; }
}

let bgToken = 0;
async function setBgWord(word) {
  $('bg').style.setProperty('--hue', hueForWord(word));
  const token = ++bgToken;
  const photo = $('bgPhoto');
  photo.classList.remove('on');
  const src = await photoFor(word);
  if (token !== bgToken) return;  // a newer search landed while this one was in flight
  if (src) {
    photo.style.backgroundImage = `url("${src}")`;
    photo.classList.add('on');
  } else {
    photo.style.backgroundImage = '';
  }
}

async function lookup(word, el) {
  setBgWord(word);
  el.innerHTML = `<p class="muted">${esc(t('ui.lookingUp'))}</p>`;
  const lang = wordLang;
  try {
    const [defs, chain] = await Promise.all([definitions(word, lang), etymology(word, lang)]);
    if (lang !== wordLang) return;  // the picker moved while we were in flight
    if (!defs && !chain.length) {
      el.innerHTML = `<p class="muted">${esc(t('ui.nothingFoundFor', { word }))}</p>`;
      return;
    }
    render(el, word, defs, chain);
  } catch {
    el.innerHTML = `<p class="muted">${esc(t('ui.networkError'))}</p>`;
  }
}

/** Today's word in the current word language, or null if we ship no list for it. */
function wordOfTheDay() {
  const list = i18n.wordsOfTheDay[wordLang];
  if (!list || !list.length) return null;
  return list[Math.floor(Date.now() / 864e5) % list.length];  // stable per calendar day
}

function renderWordOfTheDay() {
  const w = wordOfTheDay();
  $('wotd').innerHTML = '';
  if (!w) return;
  const label = document.createElement('div');
  label.className = 'label';
  label.style.marginTop = '1.5rem';
  label.textContent = t('ui.wotd');
  const card = document.createElement('div');
  $('wotd').append(label, card);
  lookup(w, card);
}

function wordLangPicker() {
  const sel = document.createElement('select');
  sel.setAttribute('aria-label', t('ui.wordLanguage'));
  sel.title = t('ui.wordLanguage');
  const collator = new Intl.Collator(i18n.locale);
  i18n.wordLanguages
    .map(l => ({ code: l.code, name: i18n.languageName(l.code) }))
    .sort((a, b) => collator.compare(a.name, b.name))
    .forEach(l => {
      const opt = document.createElement('option');
      opt.value = l.code;
      opt.textContent = l.name;
      if (l.code === wordLang) opt.selected = true;
      sel.appendChild(opt);
    });
  sel.addEventListener('change', () => {
    wordLang = sel.value;
    try { localStorage.setItem(WORD_LANG_KEY, wordLang); } catch (e) { /* storage disabled */ }
    // A word only exists in one language, so the current query is almost certainly stale.
    $('q').value = '';
    $('out').innerHTML = '';
    renderWordOfTheDay();
  });
  return sel;
}

function renderChrome() {
  document.title = t('web.title');
  if ($('tagline')) $('tagline').textContent = t('ui.tagline');
  $('q').placeholder = t('ui.searchPlaceholder');
  $('q').setAttribute('aria-label', t('ui.searchPlaceholder'));
  const uiPicker = i18n.localePicker(t('ui.interfaceLanguage'));
  uiPicker.title = t('ui.interfaceLanguage');
  $('uiPicker').appendChild(uiPicker);
  $('wordPicker').appendChild(wordLangPicker());
  $('attr').innerHTML =
    `${esc(t('ui.alsoOnApple'))} ` +
    `<a href="https://en.wiktionary.org">${esc(t('ui.attribution'))}</a> ` +
    `<a href="/privacy.html">${esc(t('ui.privacy'))}</a>`;
}

let debounce = null;
$('q').addEventListener('input', e => {
  const word = e.target.value.trim().toLowerCase();
  clearTimeout(debounce);
  if (!word) { $('out').innerHTML = ''; $('wotd').style.display = 'block'; return; }
  $('wotd').style.display = 'none';
  debounce = setTimeout(() => lookup(word, $('out')), 350);
});

renderChrome();
// The root page is the app. English opens on "word"; other languages open on their word of the day.
const isEmbed = () => { try { return document.documentElement.classList.contains('embed'); } catch { return false; } };
if (wordLang === 'en' && !isEmbed()) {
  $('q').value = 'word';
  $('wotd').style.display = 'none';
  lookup('word', $('out'));
} else {
  renderWordOfTheDay();
}

// Idle demo: after IDLE_MS of nobody touching the page, type through DEMO_WORDS one at a time.
// Any touch, key, click or scroll ends it and the page is theirs; the demo comes back if
// they walk away again. ponytail: plain timers, no library; reduced-motion visitors never see it.
const DEMO_WORDS = ('nice salary quarantine sinister companion husband alcohol algebra assassin candidate cereal clue daisy ' +
  'dexterity disaster echo galaxy gossip january lunatic muscle nightmare nostalgia orient precocious rival sarcasm silly ' +
  'sincere tragedy volcano window atlas panic vaccine calculate bank bonfire pedigree curfew daffodil goodbye nausea pants ' +
  'sandwich boycott denim jeans marathon mentor narcissism odyssey pandemonium tantalize robot pioneer salad sabotage trivial ' +
  'mortgage ketchup kindergarten tsunami safari pajamas shampoo bungalow coffee sugar tea chocolate tomato avocado banana ' +
  'ginger orange lemon whisky vodka magazine arsenal admiral zero cipher alchemy elixir sapphire amber ivory coral pearl ' +
  'oasis tundra jungle desert island peninsula volcano glacier horizon eclipse comet planet aurora zenith nadir harvest ' +
  'orchard meadow thunder lightning breeze mirage ghost phantom spirit genius muse rhapsody lyric sonnet ballad ' +
  'symphony chorus rhythm melody').split(' ').filter((w, i, a) => a.indexOf(w) === i);
const IDLE_MS = 10000, TYPE_MS = 110, HOLD_MS = 5500;
const calm = typeof matchMedia !== 'function' || matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
let demoOn = false, demoAt = 0, idleTimer = null;
async function demo() {
  demoOn = true;
  while (demoOn) {
    if (document.hidden) { await sleep(1000); continue; }
    const w = DEMO_WORDS[demoAt++ % DEMO_WORDS.length];
    $('q').value = '';
    for (const ch of w) { if (!demoOn) return; $('q').value += ch; await sleep(TYPE_MS); }
    if (!demoOn) return;
    $('wotd').style.display = 'none';
    lookup(w, $('out'));
    await sleep(HOLD_MS);
  }
}
function armDemo() {
  clearTimeout(idleTimer);
  if (calm || wordLang !== 'en' || isEmbed()) return;
  idleTimer = setTimeout(() => { if (!demoOn) demo(); }, IDLE_MS);
}
if (typeof addEventListener === 'function') ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(ev =>
  addEventListener(ev, () => { demoOn = false; armDemo(); }, { passive: true }));
armDemo();

// Accessors for webmcp.js — kept separate so the lookup/definitions/etymology
// functions above stay free of any agent-facing concerns.
window.wordrootLookup = word => lookup(word, $('out'));
window.wordrootDefinitions = definitions;
window.wordrootEtymology = etymology;
window.wordrootOfTheDay = wordOfTheDay;
window.wordrootWordLanguage = () => wordLang;
window.wordrootWordLanguages = () => i18n.wordLanguages;
</script>
<script src="webmcp.js"></script>
  <script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));</script>
</body>
</html>
